<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b172a">
  <meta name="description" content="Código de entrada da JJ´s by Luggy.">
  <title>JJ´s by Luggy — Código de entrada</title>

  <style>
    :root {
      --navy: #0b172a;
      --navy-2: #12243d;
      --gold: #d6b36a;
      --gold-light: #f0dca8;
      --white: #ffffff;
      --muted: #b8c3d1;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 20% 15%, rgba(214, 179, 106, 0.14), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.06), transparent 30%),
        linear-gradient(145deg, var(--navy) 0%, var(--navy-2) 52%, #07101e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 47%, rgba(255,255,255,.025) 48%, transparent 49%),
        linear-gradient(295deg, transparent 0 57%, rgba(214,179,106,.025) 58%, transparent 59%);
    }

    .page {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .card {
      text-align: center;
      padding: 42px 28px 34px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      border: 1px solid rgba(214, 179, 106, 0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .eyebrow {
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin: 0 auto 34px;
      max-width: 310px;
    }

    .code-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .code-box {
      border: 1px solid rgba(214, 179, 106, 0.45);
      border-radius: 20px;
      padding: 22px 18px 24px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,0.09),
        rgba(255,255,255,0.035)
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 12px 30px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }

    .entry-code {
      color: var(--white);
      font-size: clamp(56px, 16vw, 78px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 10px;
      padding-left: 10px;
      font-variant-numeric: tabular-nums;
    }

    .instruction {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 30px 0 22px;
    }

    .footer {
      color: rgba(255,255,255,0.58);
      font-size: 12px;
      line-height: 1.5;
    }

    .footer strong {
      color: rgba(255,255,255,0.82);
      font-weight: 500;
    }

    @media (max-width: 380px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 34px 20px 28px;
        border-radius: 24px;
      }

      .entry-code {
        letter-spacing: 7px;
        padding-left: 7px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="card" aria-label="Código de entrada">

      <div class="brand-mark" aria-hidden="true">JJ</div>

      <div class="eyebrow">Bem-vindo</div>

      <h1>JJ´s by Luggy</h1>

      <p class="subtitle">
        Utilize o código abaixo para entrar na loja.
      </p>

      <div class="code-label">Código de entrada</div>

      <div class="code-box">
        <!-- ALTERAR APENAS O NÚMERO ABAIXO QUANDO FOR NECESSÁRIO -->
        <div class="entry-code" id="entryCode">3719</div>
      </div>

      <p class="instruction">
        Apresente este código à entrada da loja.
      </p>

      <div class="divider"></div>

      <p class="footer">
        Obrigado pela sua visita.<br>
        <strong>JJ´s by Luggy</strong>
      </p>

    </section>
  </main>
</body>
</html>
