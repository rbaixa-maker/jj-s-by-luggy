<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b172a">
  <meta name="description" content="Código de entrada da JJ´s by Luggy.">
  <title>JJ´s by Luggy — Código de entrada</title>

  <style>
    :root {
      --navy: #0b172a;
      --navy-2: #12243d;
      --gold: #d6b36a;
      --gold-light: #f0dca8;
      --white: #ffffff;
      --muted: #b8c3d1;
      --card: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   Helvetica, Arial, sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 20% 15%, rgba(214, 179, 106, 0.14), transparent 28%),
        radial-gradient(circle at 85% 80%, rgba(255, 255, 255, 0.06), transparent 30%),
        linear-gradient(145deg, var(--navy) 0%, var(--navy-2) 52%, #07101e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(115deg, transparent 0 47%, rgba(255,255,255,.025) 48%, transparent 49%),
        linear-gradient(295deg, transparent 0 57%, rgba(214,179,106,.025) 58%, transparent 59%);
    }

    .language-selector {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(11, 23, 42, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0,0,0,.22);
    }

    .lang-btn {
      width: 36px;
      height: 32px;
      border: 0;
      border-radius: 11px;
      background: transparent;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .18s ease, background .18s ease;
    }

    .lang-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,.08);
    }

    .lang-btn.active {
      background: rgba(214,179,106,.20);
      box-shadow: inset 0 0 0 1px rgba(214,179,106,.38);
    }

    .lang-btn:focus-visible {
      outline: 2px solid var(--gold-light);
      outline-offset: 2px;
    }

    .page {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .card {
      text-align: center;
      padding: 42px 28px 34px;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
    }

    .brand-mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      border: 1px solid rgba(214, 179, 106, 0.55);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold-light);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .eyebrow {
      color: var(--gold-light);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 8vw, 42px);
      font-weight: 500;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
      margin: 0 auto 34px;
      max-width: 310px;
    }

    .code-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .code-box {
      border: 1px solid rgba(214, 179, 106, 0.45);
      border-radius: 20px;
      padding: 22px 18px 24px;
      background: linear-gradient(
        145deg,
        rgba(255,255,255,0.09),
        rgba(255,255,255,0.035)
      );
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 12px 30px rgba(0,0,0,0.15);
      margin-bottom: 20px;
    }

    .entry-code {
      color: var(--white);
      font-size: clamp(56px, 16vw, 78px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: 10px;
      padding-left: 10px;
      font-variant-numeric: tabular-nums;
    }

    .instruction {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 30px 0 22px;
    }

    .footer {
      color: rgba(255,255,255,0.58);
      font-size: 12px;
      line-height: 1.5;
    }

    .footer strong {
      color: rgba(255,255,255,0.82);
      font-weight: 500;
    }

    @media (max-width: 520px) {
      body {
        padding: 72px 14px 14px;
      }

      .language-selector {
        top: 12px;
        right: 12px;
      }

      .card {
        padding: 34px 20px 28px;
        border-radius: 24px;
      }
    }

    @media (max-width: 380px) {
      .lang-btn {
        width: 32px;
        height: 30px;
        font-size: 18px;
      }

      .language-selector {
        gap: 2px;
        padding: 4px;
      }

      .entry-code {
        letter-spacing: 7px;
        padding-left: 7px;
      }
    }
  </style>
</head>

<body>

  <!-- Seletor de idiomas -->
  <nav class="language-selector" aria-label="Seleção de idioma">
    <button class="lang-btn active" data-lang="pt" aria-label="Português" title="Português">🇵🇹</button>
    <button class="lang-btn" data-lang="fr" aria-label="Français" title="Français">🇫🇷</button>
    <button class="lang-btn" data-lang="en" aria-label="English" title="English">🇬🇧</button>
    <button class="lang-btn" data-lang="de" aria-label="Deutsch" title="Deutsch">🇩🇪</button>
    <button class="lang-btn" data-lang="it" aria-label="Italiano" title="Italiano">🇮🇹</button>
    <button class="lang-btn" data-lang="es" aria-label="Español" title="Español">🇪🇸</button>
  </nav>

  <main class="page">
    <section class="card" aria-label="Código de entrada">

      <div class="brand-mark" aria-hidden="true">JJ</div>

      <div class="eyebrow" data-i18n="welcome">Bem-vindo</div>

      <h1>JJ´s by Luggy</h1>

      <p class="subtitle" data-i18n="subtitle">
        Utilize o código abaixo para entrar na loja.
      </p>

      <div class="code-label" data-i18n="codeLabel">Código de entrada</div>

      <div class="code-box">
        <!-- ALTERAR APENAS O NÚMERO ABAIXO QUANDO FOR NECESSÁRIO -->
        <div class="entry-code" id="entryCode">3719</div>
      </div>

      <p class="instruction" data-i18n="instruction">
        Apresente este código à entrada da loja.
      </p>

      <div class="divider"></div>

      <p class="footer">
        <span data-i18n="thanks">Obrigado pela sua visita.</span><br>
        <strong>JJ´s by Luggy</strong>
      </p>

    </section>
  </main>

  <script>
    const translations = {
      pt: {
        pageTitle: "JJ´s by Luggy — Código de entrada",
        welcome: "Bem-vindo",
        subtitle: "Utilize o código abaixo para entrar na loja.",
        codeLabel: "Código de entrada",
        instruction: "Apresente este código à entrada da loja.",
        thanks: "Obrigado pela sua visita."
      },
      fr: {
        pageTitle: "JJ´s by Luggy — Code d'entrée",
        welcome: "Bienvenue",
        subtitle: "Utilisez le code ci-dessous pour entrer dans le magasin.",
        codeLabel: "Code d'entrée",
        instruction: "Présentez ce code à l'entrée du magasin.",
        thanks: "Merci de votre visite."
      },
      en: {
        pageTitle: "JJ´s by Luggy — Entry code",
        welcome: "Welcome",
        subtitle: "Use the code below to enter the store.",
        codeLabel: "Entry code",
        instruction: "Please show this code at the store entrance.",
        thanks: "Thank you for your visit."
      },
      de: {
        pageTitle: "JJ´s by Luggy — Zugangscode",
        welcome: "Willkommen",
        subtitle: "Verwenden Sie den folgenden Code, um den Laden zu betreten.",
        codeLabel: "Zugangscode",
        instruction: "Zeigen Sie diesen Code am Eingang des Ladens vor.",
        thanks: "Vielen Dank für Ihren Besuch."
      },
      it: {
        pageTitle: "JJ´s by Luggy — Codice di ingresso",
        welcome: "Benvenuti",
        subtitle: "Utilizza il codice qui sotto per entrare nel negozio.",
        codeLabel: "Codice di ingresso",
        instruction: "Mostra questo codice all'ingresso del negozio.",
        thanks: "Grazie per la visita."
      },
      es: {
        pageTitle: "JJ´s by Luggy — Código de entrada",
        welcome: "Bienvenido",
        subtitle: "Utiliza el código de abajo para entrar en la tienda.",
        codeLabel: "Código de entrada",
        instruction: "Muestra este código en la entrada de la tienda.",
        thanks: "Gracias por su visita."
      }
    };

    const htmlLang = {
      pt: "pt-PT",
      fr: "fr-FR",
      en: "en-GB",
      de: "de-DE",
      it: "it-IT",
      es: "es-ES"
    };

    function setLanguage(lang) {
      const t = translations[lang];
      if (!t) return;

      document.documentElement.lang = htmlLang[lang];
      document.title = t.pageTitle;

      document.querySelectorAll("[data-i18n]").forEach(element => {
        const key = element.getAttribute("data-i18n");
        if (t[key]) element.textContent = t[key];
      });

      document.querySelectorAll(".lang-btn").forEach(button => {
        const active = button.dataset.lang === lang;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", active ? "true" : "false");
      });

      try {
        localStorage.setItem("jjsLanguage", lang);
      } catch (e) {}
    }

    document.querySelectorAll(".lang-btn").forEach(button => {
      button.addEventListener("click", () => {
        setLanguage(button.dataset.lang);
      });
    });

    // Mantém o idioma escolhido quando o visitante voltar à página.
    let savedLanguage = "pt";
    try {
      savedLanguage = localStorage.getItem("jjsLanguage") || "pt";
    } catch (e) {}

    setLanguage(translations[savedLanguage] ? savedLanguage : "pt");
  </script>

</body>
</html>
